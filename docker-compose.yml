services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: puppy
      POSTGRES_PASSWORD: puppy_dev_password
      POSTGRES_DB: puppy_study
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - puppy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puppy -d puppy_study"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  puppy-postgres-data:
